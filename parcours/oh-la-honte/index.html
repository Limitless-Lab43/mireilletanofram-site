<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>Oh la honte ! · Mon parcours</title><style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>

/* Direction afro chaude : ivoire, chocolat, or mat */
:root{--ivory:#F8F6F2;--paper:#fffdf9;--brown:#2E1A1F;--deep:#2E1A1F;--gold:#C9A34F;--gold-l:#f1e4c4}

</head><body>
<header class="top"><div class="wrap"><div class="brand">FRAMYXCC<small>Oh la honte ! &amp; la peur d’avoir honte</small></div><button class="link" id="versAccueil">Mon parcours</button></div><div class="wrap"><div class="daysbar" id="daysbar"></div></div></header>
<main><div class="wrap" id="app"></div></main>
<div class="toast" id="toast"></div>

<script>
const JETON0 = (function(){ let t = ''; try { t = new URLSearchParams(location.search).get('a') || ''; } catch(e) {}
  t = /^[A-Za-z0-9_-]{20,80}$/.test(t) ? t : '';
  try { if (t) localStorage.setItem('olh-jeton', t); else t = localStorage.getItem('olh-jeton') || ''; } catch(e) {}
  return /^[A-Za-z0-9_-]{20,80}$/.test(t) ? t : ''; })();
let C = { jours: [], kenan_echanges_max: 4 };
const KEY = 'olh-v1-' + JETON0.slice(0, 16);
let E = { reponses:{}, exercices:{}, retenir:{}, tests:{}, syntheses:{}, chats:{}, termines:[], position:{jour:1,etape:0} };
try { const s = localStorage.getItem(KEY); if (s) E = Object.assign(E, JSON.parse(s)); } catch(e) {}
// nettoyage : messages vides ou en attente laissés par une interruption
function nettoyerChats(){ for (const k in E.chats) { E.chats[k] = (E.chats[k] || []).filter(m => m && !m.attente && typeof m.t === 'string' && m.t); if (!E.chats[k].length) delete E.chats[k]; } }
nettoyerChats();
let tous = false;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = $('#app');

function sauver(msg){ synchro(); try { const copie = JSON.parse(JSON.stringify(E)); for (const k in copie.chats) copie.chats[k] = copie.chats[k].filter(m => m && !m.attente); localStorage.setItem(KEY, JSON.stringify(copie)); } catch(e) {} if (msg) toast(msg); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1600); }
const jour = n => C.jours.find(j => j.n === n);
const ouvert = n => tous || (n === 1 ? !!E.livret || !C.livret : E.termines.includes(n-1));
const ASSETS_LIVRET = '/assets/oh-la-honte/';
const fait = n => E.termines.includes(n);
const situation = () => (E.exercices.j1e4 || '').trim();
const projetRef = () => (E.exercices.j1e5 || '').trim();
const aideProjet = () => { const r = E.reponses.j1q1; return !!(r && r.choix.length && r.choix[0] > 0) || !!(E.chats.p && E.chats.p.length > 1); };
const court = (t, n=90) => { t = String(t).trim().replace(/\s+/g,' '); return t.length > n ? t.slice(0, n-1).trim() + '…' : t; };
const choixTextes = q => { const r = E.reponses[q.id]; return r && r.choix ? r.choix.map(i => q.options[i]) : []; };

/* ---------- Kenan, conversation guidée ---------- */
const SECURITE = /(suicid|me tuer|me supprimer|envie de mourir|veux mourir|en finir(?! avec)|me faire du mal|me blesser|plus envie de vivre|veux disparaître|disparaître pour toujours|à quoi bon (vivre|continuer)|plus la force de vivre)/i;
const MSG_SECURITE = "Ce que vous écrivez est important, et vous n’avez pas à le porter sans aide. Je ne suis pas en mesure de vous aider sur ce point : contactez sans attendre un professionnel de santé, un service d’urgence ou une personne de confiance. Vous pourrez reprendre le parcours quand vous le souhaiterez.";

function rappelSituation(){ const p = projetRef(); return p ? `Gardons en tête votre projet : « ${court(p, 80)} ». ` : ''; }

const REACTIONS = {
  j1q1: c => c[0] === 'Oui, je sais lequel' ? `Très bien. Vous l’écrirez en une phrase dans l’exercice, tout à l’heure.` : c.length ? `Aucun souci, c’est fréquent. Dans l’exercice, je vous poserai quelques questions pour le faire apparaître, ensemble.` : null,
  j1q2: c => c.includes('Je ne sais pas encore') ? `Ce n’est pas grave. En écrivant votre projet et ce que vous redoutez, le moteur apparaîtra souvent de lui-même.` : c.length ? `« ${court(c[0],70)} » : c’est le moteur sur lequel nous allons nous appuyer. Savoir lequel agit chez vous, c’est déjà reprendre un peu de pouvoir sur lui.` : null,
  j1q3: c => /Plus d’un an|Plusieurs années/.test(c[0]||'') ? `Merci pour votre franchise. Un projet que l’on garde aussi longtemps compte vraiment : il mérite ces sept jours.` : c.length ? `Gardez cette durée en tête : au septième jour, vous fixerez une date pour vous lancer.` : null,
  j2q1: c => c.length ? `Vous imaginez qu’on pourrait penser : « ${court(c[0],60)} »${c.length>1?' et d’autres choses encore':''}. Notez que c’est une pensée sur ce que les autres penseraient, pas un fait.` : null,
  j2q2: c => /pas de preuve|Je ne sais pas/.test(c[0]||'') ? `Sans preuve, ce scénario reste une hypothèse. C’est une bonne nouvelle : une hypothèse peut être vérifiée, ou remplacée.` : c.length ? `Une expérience passée compte. Elle ne dit pourtant pas à coup sûr ce qui se passera cette fois-ci, avec d’autres personnes et un autre vous.` : null,
  j2q3: c => /m’en remettrais|pas grand-chose/.test(c[0]||'') ? `Vous voyez déjà que l’issue serait supportable. Ce recul est précieux.` : c[0] === 'Les conséquences seraient sérieuses' ? `Dans ce cas, il est légitime d’être prudent. Choisissons ensemble une première étape plus petite et sans risque.` : c.length ? `Se poser la question, c’est déjà desserrer un peu l’étau.` : null,
  j3q1: c => c.length ? `Vous reconnaissez : « ${court(c[0],60)} »${c.length>1?` et ${c.length-1} autre${c.length>2?'s':''} stratégie${c.length>2?'s':''}`:''}. Ces stratégies ne sont pas des défauts : ce sont des protections apprises.` : null,
  j3q2: c => c.length ? `Ce que la stratégie vous évite est réel. La question n’est pas de la supprimer, mais de savoir quand elle vous sert et quand elle vous freine.` : null,
  j3q3: c => c.length ? `« ${court(c[0],60)} » : voilà ce que cette protection peut vous coûter. Le voir clairement aide à choisir autrement.` : null,
  j4q1: c => c.length ? `Vous craignez ce jugement : « ${court(c[0],60)} ». Un jugement décrit au mieux un moment, jamais une personne tout entière.` : null,
  j4q2: c => /moment|petite partie/.test(c[0]||'') ? `Exactement : votre identité est bien plus vaste que ce jugement.` : c.length ? `Ce sentiment est fréquent. Aujourd’hui, nous allons justement chercher une façon plus juste de vous voir.` : null,
  j4q3: c => c.length ? `Vous diriez à quelqu’un que vous respectez : « ${court(c[0],60)} ». Et si vous vous l’accordiez aussi ?` : null,
  j5q1: c => c.length ? `« ${c[0]} » : c’est une action concrète et accessible. ${rappelSituation()}` : null,
  j5q2: c => c[0] === 'Le faire directement' ? `Vous choisissez d’y aller directement. Il reste à choisir le moment.` : c.length ? `« ${c[0]} » : un petit pas, c’est souvent ce qui rend le grand possible.` : null,
  j5q3: c => c[0] === 'Simplement l’avoir fait' ? `C’est le meilleur critère de réussite : avoir osé, quel que soit le résultat.` : c.length ? `Gardez un objectif réaliste. L’important est d’agir, pas d’être parfait.` : null,
  j6q1: c => c.length ? `Vous redoutez surtout : « ${court(c[0],60)} ». Préparer une réponse à l’avance aide à ne pas rester figé.` : null,
  j6q2: c => c[0] === 'Je prends du recul et je réponds calmement' ? `Vous avez déjà une belle ressource. Nous allons la renforcer.` : c.length ? `Cette réaction est compréhensible. Aujourd’hui, vous allez préparer une autre option, plus calme, à garder en réserve.` : null,
  j6q3: c => c.includes('Je ne vois personne pour l’instant') ? `Pour l’instant, personne ne vous vient à l’esprit. C’est fréquent. Une personne bienveillante peut être un ancien collègue, un voisin, un groupe : gardez la question ouverte.` : c.length ? `S’appuyer sur quelqu’un n’est pas une faiblesse : c’est une ressource.` : null,
  j7q1: c => c.length ? `« ${c[0]} » : voilà ce que vous emportez de ces sept jours.` : null,
  j7q2: c => c[0] === 'Oui' ? `Bravo. Vous l’avez fait : souvenez-vous de ce moment la prochaine fois que la peur se présentera.` : c[0] === 'En partie' ? `En partie, c’est déjà un pas réel. Il compte.` : c[0] === 'Pas encore' ? `Pas encore, et ce n’est pas un échec. Votre action reste devant vous, prête quand vous le serez.` : c.length ? `Vous avez adapté votre action : c’est de la souplesse, pas un renoncement.` : null,
  j7q3: c => c.length ? `Votre stratégie pour la prochaine fois : « ${court(c[0],60)} ». Vous savez maintenant quoi faire.` : null,
};
function reactionKenan(q){
  const r = E.reponses[q.id] || {};
  if (r.texte && SECURITE.test(r.texte)) return MSG_SECURITE;
  const f = REACTIONS[q.id]; const t = f ? f(choixTextes(q)) : null;
  if (t) return t;
  if (r.texte) return `Merci d’avoir précisé : « ${court(r.texte, 80)} ».`;
  return null;
}
function reponseChat(j, histo, texte){
  if (SECURITE.test(texte)) return MSG_SECURITE;
  const nbUser = histo.filter(m => m.r === 'u').length;
  const relance = j.kenan_relances[nbUser];
  const echo = texte.trim().split(/\s+/).length > 3 ? `Vous dites : « ${court(texte, 70)} ». ` : '';
  const accueil = ['Merci de l’avoir écrit. ', 'Je vous entends. ', 'C’est précieux de le formuler. '][nbUser % 3];
  if (relance) return accueil + echo + relance;
  return accueil + echo + `Gardez ce qui vous paraît le plus important : vous pourrez le noter dans « ${j.retenir} ».`;
}

const ROLE = 'votre interlocuteur en développement humain durable';
let MAX_ECH = 4;
const SYNTH_CONSIGNE = 'C’est le dernier échange. Fais maintenant la synthèse : reformule en deux ou trois phrases ce que la personne a exprimé, propose une seule action concrète, petite et réaliste pour aujourd’hui, en lien avec l’objectif du jour (par exemple : «ACTION»), puis conclus brièvement en l’invitant à passer au test du jour, puis à « Ce que je retiens ». Ne pose aucune nouvelle question.';

const BACKEND = 'https://framyxcc-academie.rubiscc-voyages.workers.dev';
const JETON = JETON0;
function contexteKenan(j){
  const L = [`Jour ${j.n} : « ${j.titre} ». Objectif : ${j.objectif}`];
  if (projetRef()) L.push(`Projet de la personne, fil rouge des sept jours (repoussé à cause de la honte) : ${court(projetRef(), 300)}`);
  if ((E.exercices.j1e6||'').trim()) L.push(`Pourquoi ce projet compte : ${court(E.exercices.j1e6, 200)}`);
  if ((E.exercices.j1e7||'').trim()) L.push(`Ce que la personne redoute réellement : ${court(E.exercices.j1e7, 200)}`);
  { const r = E.reponses.j1q2, q = C.jours[0] && C.jours[0].questions && C.jours[0].questions[1]; if (r && q && r.choix.length) L.push(`Moteur de honte reconnu au jour 1 : ${r.choix.map(i => q.options[i]).join(' ; ')}`); }
  const s = situation(); if (s) L.push(`Moment où la peur du jugement l’a fait reculer face au projet : ${court(s, 300)}`);
  for (const q of j.questions) { const c = choixTextes(q), r = E.reponses[q.id] || {}; if (c.length || r.texte) L.push(`Question « ${q.texte} » : ${[c.join(' ; '), r.texte].filter(Boolean).join(' | ')}`); }
  for (const f of j.exercice.champs) { const v = (E.exercices[f.id]||'').trim(); if (v) L.push(`${f.label} : ${court(v, 300)}`); }
  if (j.n > 2 && E.exercices.j2e3) L.push(`Autre issue imaginée au jour 2 : ${court(E.exercices.j2e3, 200)}`);
  if (j.n > 3 && E.exercices.j3e4) L.push(`Vrais besoins pour commencer, notés au jour 3 : ${court(E.exercices.j3e4, 200)}`);
  if (j.n > 5 && E.exercices.j5e1) L.push(`Première action vers le projet, choisie au jour 5 : ${court(E.exercices.j5e1, 200)}`);
  if (j.n > 6 && E.exercices.j6e3) L.push(`Personne à qui parler du projet en premier : ${court(E.exercices.j6e3, 120)}`);
  return L.join('\n').slice(0, 2500);
}
let sampleNS;
async function moteurDemo(){ if (sampleNS === undefined) { try { sampleNS = (window.claude && await window.claude.use('sample')) || null; } catch(e) { sampleNS = null; } } return sampleNS; }
async function repondreIA(j, h, synthese, mode){
  const RP = C.recherche_projet || {};
  const msgs = h.map(m => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t.slice(0, 1500) }));
  if (BACKEND) {
    try {
      const r = await fetch(BACKEND + '/oh-la-honte/kenan', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ a: JETON, jour: j.n, mode: mode || '', contexte: contexteKenan(j), messages: msgs, synthese: !!synthese, echange: msgs.filter(m => m.role==='user').length }) });
      const d = await r.json(); if (d.texte) return { t: d.texte, ia: d.mode === 'ia' };
    } catch(e) {}
    return null;
  }
  const s = await moteurDemo(); if (!s) return null;
  // premier message : consignes + contexte + ouverture de Kenan, puis l'échange
  if (mode === 'projet') {
    const tp = `${C.kenan_consignes}\n${RP.consigne}\n\nContexte du parcours (réponses réelles de la personne) :\n${contexteKenan(j)}\n\nTu as ouvert l’échange par : « ${msgs[0].content} »\n\nRéponse de la personne : `;
    if (synthese) msgs[msgs.length-1] = { role:'user', content: msgs[msgs.length-1].content + '\n\n[Consigne pour Kenan : ' + RP.synthese + ']' };
    const inp = [{ role:'user', content: tp + msgs[1].content }].concat(msgs.slice(2));
    try { const r = await s(inp, { modelTier:'quick', cache:false }); const t = (r && r.text || '').replace(/—/g, ',').trim(); return t ? { t, ia:true } : null; } catch(e) { return null; }
  }
  const tete = `${C.kenan_consignes}\n- Déroulé : l’échange compte ${MAX_ECH} réponses de la personne au maximum. Pose une seule question à la fois et fais avancer la réflexion vers une action.\n\nObjectif du jour : ${j.objectif}\n\nContexte du parcours (réponses réelles de la personne) :\n${contexteKenan(j)}\n\nTu as ouvert l’échange par : « ${msgs[0].content} »\n\nRéponse de la personne : `;
  if (synthese) msgs[msgs.length-1] = { role:'user', content: msgs[msgs.length-1].content + '\n\n[Consigne pour Kenan : ' + SYNTH_CONSIGNE.replace('ACTION', j.kenan_action) + ']' };
  const input = [{ role:'user', content: tete + msgs[1].content }].concat(msgs.slice(2));
  try { const r = await s(input, { modelTier:'quick', cache:false }); const t = (r && r.text || '').replace(/—/g, ',').trim(); return t ? { t, ia:true } : null; } catch(e) { return null; }
}

function syntheseGuidee(j, h){
  const dits = h.filter(m => m.r === 'u' && !/^Je souhaite terminer/.test(m.t)).map(m => court(m.t, 70));
  const rappel = dits.length ? `Vous avez parlé de : « ${dits[dits.length-1]} ». ` : '';

    <p class="note" style="margin:0">Un problème technique ? <button class="link" id="versAssistance" style="white-space:normal">Signaler un problème</button></p></div>`;
  window.scrollTo(0,0);

  const suiv = $('#suiv');
  $('#prec').onclick = () => etape === 0 ? accueil() : ouvrir(n, etape-1);
  $('#plusTard').onclick = () => { sauver('Progression enregistrée'); accueil(); };
  $('#versAssistance').onclick = () => { sauver(); accueil(); setTimeout(() => { const x = $('#assistance'); if (x) { x.scrollIntoView({ block:'start' }); $('#asMsg').focus(); } }, 50); };
  const avancer = () => {
    if (fin) {
      if (!E.termines.includes(n)) E.termines.push(n);
      E.position = { jour: Math.min(n+1,7), etape:0 }; sauver(`Jour ${n} terminé`);
      return n === 7 ? bilan() : accueil();
    }
    ouvrir(n, etape+1);
  };
  suiv.onclick = avancer;
  const ps = $('#passer'); if (ps) ps.onclick = () => ouvrir(n, etape+1);

  if (etape >= 1 && etape <= 3) {
    const q = j.questions[etape-1];
    const maj = () => {
      const r = E.reponses[q.id] || { choix:[], texte:'' };
      suiv.disabled = !(r.choix.length || r.texte);

      $('#reac').innerHTML = t ? `<div class="kenan"><div class="av">K</div><div class="bubble"><div class="who">Kenan</div>${esc(t)}</div></div>` : '';

    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {

    maj();
  }
  if (etape === 4) app.querySelectorAll('textarea[data-f]').forEach(t => t.oninput = () => { E.exercices[t.dataset.f] = t.value; sauver(); });
  if (etape === 4 && $('#trouver')) {
    const RP = C.recherche_projet, MAXP = RP.echanges_max || 5; let occupeP = false;

    const echP = async (t, fin) => {
      if (occupeP || !t) return;
      const h = E.chats.p; if (h.some(m => m.synthese)) return;
      h.push({ r:'u', t });
      if (SECURITE.test(t)) { h.push({ r:'k', t: MSG_SECURITE }); sauver(); ouvrir(n, 4); return defP(); }
      const nbU = h.filter(m => m.r === 'u').length, synth = fin || nbU >= MAXP;
      occupeP = true; h.push({ r:'k', t:'', attente:true }); ouvrir(n, 4); defP();
      const rep = await repondreIA(j, h.slice(0, -1), synth, 'projet');
      h.pop();
      if (rep) h.push({ r:'k', t: rep.t, synthese: synth });
      else h.push({ r:'k', t: synth ? RP.synthese_guidee : (RP.questions_guidees[nbU-1] || RP.synthese_guidee), g:true, synthese: synth || !RP.questions_guidees[nbU-1] });
      occupeP = false; sauver(); ouvrir(n, 4); defP();
      if (h[h.length-1].synthese) setTimeout(() => { const f = app.querySelector('textarea[data-f="j1e5"]'); if (f) f.scrollIntoView({ block:'center' }); }, 50);
    };
    const envP = () => { const ta = $('#msgp'); if (ta) echP(ta.value.trim().slice(0, 1500), false); };
    const be = $('#envoyerp'); if (be) be.onclick = envP;
    const mg = $('#msgp'); if (mg) mg.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); envP(); } };
    const bt = $('#terminerp'); if (bt) bt.onclick = () => echP('J’ai trouvé, je souhaite écrire mon projet.', true);
  }
  if (etape === 7) $('#ret').oninput = e => { E.retenir[n] = e.target.value; sauver(); };
  if (etape === 0 && $('#ecouter')) {
    $('#ecouter').onclick = () => {
      const synth = window.speechSynthesis;
      if (synth.speaking) { synth.cancel(); $('#ecouter').textContent = 'Écouter le chapitre'; return; }
      const tmp = document.createElement('div'); tmp.innerHTML = $('.chap').innerHTML.replace(/<br>/g, ' ');

      u.lang = 'fr-FR'; u.rate = 0.95; u.onend = () => { const b = $('#ecouter'); if (b) b.textContent = 'Écouter le chapitre'; };

  }
  if (etape === 6) app.querySelectorAll('.test').forEach(bloc => {
    const q = j.test[+bloc.dataset.q];

    const defiler = () => setTimeout(() => { const c = $('#chat'); if (c) c.lastElementChild.scrollIntoView({ block:'nearest' }); const m = $('#msg'); if (m) m.focus(); }, 0);
    const echanger = async (t, forcerSynthese) => {
      if (occupe || !t) return;
      const h = E.chats[n]; if (h.some(m => m.synthese)) return;
      h.push({ r:'u', t });
      if (SECURITE.test(t)) { h.push({ r:'k', t: MSG_SECURITE }); sauver(); ouvrir(n, 5); return defiler(); }
      const synthese = forcerSynthese || h.filter(m => m.r === 'u').length >= MAX_ECH;
      occupe = true; h.push({ r:'k', t:'', attente:true }); ouvrir(n, 5); defiler();
      const rep = await repondreIA(j, h.slice(0, -1), synthese);
      h.pop();

      else h.push({ r:'k', t: synthese ? syntheseGuidee(j, h) : reponseChat(j, h, t), g:true, synthese });

      occupe = false; sauver(); ouvrir(n, 5); defiler();

    const be = $('#envoyer'); if (be) be.onclick = envoyer;
    const mg = $('#msg'); if (mg) mg.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); envoyer(); } };
    const bt = $('#terminer'); if (bt) bt.onclick = () => echanger('Je souhaite terminer l’échange.', true);
  }
}

/* ---------- Bilan final : le regard de Kenan (progrès, axes, recommandations) ---------- */
function contexteBilan(){
  const L = [], ex = id => (E.exercices[id]||'').trim();
  const qx = id => { for (const j of C.jours) for (const x of j.questions) if (x.id===id) return x; };
  if (ex('j1e5')) L.push('Projet (fil rouge) : ' + court(ex('j1e5'), 300));
  if (ex('j1e7')) L.push('Ce que la personne redoutait réellement : ' + court(ex('j1e7'), 200));
  if (ex('j7e7')) L.push('Premier pas daté dans les 48 heures : ' + court(ex('j7e7'), 160));
  for (const j of C.jours) {
    const R = [];
    for (const q of j.questions) { const c = choixTextes(q), r = E.reponses[q.id] || {}; if (c.length || r.texte) R.push(`${q.texte} ${[c.join(' ; '), r.texte].filter(Boolean).join(' | ')}`); }
    for (const f of j.exercice.champs) if (ex(f.id)) R.push(`${f.label} : ${court(ex(f.id), 220)}`);
    if ((E.retenir[j.n]||'').trim()) R.push('Ce que je retiens : ' + court(E.retenir[j.n], 200));
    if (E.syntheses[j.n]) R.push('Synthèse de Kenan : ' + court(E.syntheses[j.n], 300));
    if (R.length) L.push(`Jour ${j.n} (${j.titre}) :\n- ` + R.join('\n- '));
  }
  return L.join('\n').slice(0, 6000);
}
function bilanGuide(){
  const ex = id => (E.exercices[id]||'').trim(), c1 = id => { const r = E.reponses[id]; const q = C.jours.flatMap(j => j.questions).find(x => x.id===id); return r && q ? choixTextes(q) : []; };
  const P = [], A = [], Rc = [];
  if (ex('j1e5')) P.push('Vous avez nommé le projet que vous repoussiez : « ' + court(ex('j1e5'), 90) + ' ».');
  if (ex('j3e4') || ex('j3e5')) P.push('Vous avez séparé vos vrais besoins pour commencer de ce qui relevait seulement de la peur.');
  if (ex('j2e2') || ex('j2e3')) P.push('Vous avez séparé ce qui s’était passé de ce que vous imaginiez, et envisagé une autre issue.');
  if (ex('j4e2')) P.push('Vous avez remplacé une pensée dévalorisante par une formulation plus juste.');
  if (ex('j6e2')) P.push('Vous avez préparé une réponse calme, prête à servir.');
  const fait = c1('j7q2')[0] || '';
  if (fait === 'Oui') P.push('Vous avez réalisé l’action choisie au jour 5 : c’est un vrai premier pas.');
  if (fait === 'En partie' || fait === 'Pas encore') A.push('Passer de l’intention à l’acte : votre action est ' + (fait === 'En partie' ? 'commencée' : 'encore à faire') + '. Réduisez-la si besoin à un geste de quelques minutes.');
  const strat = c1('j3q1'); if (strat.length) A.push('Repérer votre stratégie d’évitement au moment où elle apparaît : ' + strat.slice(0, 2).join(', ').toLowerCase() + '.');
  if ((c1('j4q2')[0]||'') === 'J’ai parfois l’impression que oui') A.push('Continuer à séparer une erreur ou un jugement de votre valeur.');
  if ((c1('j6q3')[0]||'') === 'Je ne vois personne pour l’instant') A.push('Identifier une personne de confiance à qui parler de votre projet.');
  if (!A.length) A.push('Garder le réflexe du premier jour : remarquer quand la peur du jugement décide à votre place.');
  if (ex('j7e3')) Rc.push('Commencez par votre première étape : « ' + court(ex('j7e3'), 80) + ' »' + (ex('j7e6') ? ', à la date choisie : ' + court(ex('j7e6'), 40) + '.' : '. Fixez-lui une date.'));
  else if (ex('j1e5')) Rc.push('Pour votre projet « ' + court(ex('j1e5'), 80) + ' » : choisissez un premier geste de quinze minutes et fixez-lui un jour et une heure.');
  if (ex('j6e3')) Rc.push('Parlez de votre projet à la personne choisie : ' + court(ex('j6e3'), 60) + '.');
  if (ex('j7e1')) Rc.push('Relisez chaque matin votre engagement : « ' + court(ex('j7e1'), 90) + ' ».');
  Rc.push('Quand la peur revient, revenez à la question du jour 2 : quel est le fait, ici ?');
  if (ex('j6e2')) Rc.push('Gardez votre réponse calme à portée de main, et relisez-la avant une situation qui vous inquiète.');
  if (!P.length) P.push('Vous avez parcouru les sept jours jusqu’au bout : c’est déjà vous choisir.');
  return `Vos progrès\n${P.map(x=>'• '+x).join('\n')}\nVos axes à travailler\n${A.map(x=>'• '+x).join('\n')}\nMes recommandations\n${Rc.map(x=>'• '+x).join('\n')}`;
}
function rendreRegard(t, guide){
  const z = $('#bilanKenan'); if (!z) return;
  const parts = []; let cur = null;
  for (const l of t.split('\n').map(x => x.trim()).filter(Boolean)) {
    const tit = /^(Vos progrès|Vos axes à travailler|Mes recommandations)\s*:?$/i.test(l.replace(/[«»*#]/g, '').trim());
    if (tit) { cur = { t: l.replace(/[«»*#:]/g, '').trim(), li: [] }; parts.push(cur); }
    else if (cur) cur.li.push(l.replace(/^[•\-*]\s*/, ''));
  }
  if (!parts.length) return rendreRegard(bilanGuide(), true);
  z.innerHTML = `<div class="eyebrow">Le regard de Kenan${guide ? ' · mode guidé' : ''}</div>` + parts.map(p => `<div class="item"><h3>${esc(p.t)}</h3><ul style="margin:0;padding-left:1.1em">${p.li.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')
    + `<p class="note" style="margin:0">Ce regard s’appuie uniquement sur vos réponses. Ce n’est ni une note ni un diagnostic.</p>`;
}
async function regardKenan(){
  if (E.regard) return rendreRegard(E.regard.t, E.regard.guide);
  let t = null;
  try {
    if (BACKEND) {
      const r = await fetch(BACKEND + '/oh-la-honte/kenan', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ a: JETON, jour: 7, bilan: true, contexte: contexteBilan(), messages: [{ role:'user', content:'Rédigez mon bilan final.' }] }) });
      const d = await r.json(); if (d.mode === 'ia' && d.texte) t = d.texte;
    } else {
      const sm = await moteurDemo();
      if (sm) { const r = await sm(`${C.kenan_consignes}\n${C.bilan_consigne}\n\nRéponses de la personne :\n${contexteBilan()}`, { modelTier:'quick', cache:false }); t = (r && r.text || '').replace(/—/g, ',').trim() || null; }
    }
  } catch(e) { t = null; }
  E.regard = t ? { t, guide:false } : { t: bilanGuide(), guide:true };
  sauver(); rendreRegard(E.regard.t, E.regard.guide);
}

    ${blocAssistance()}
    <div class="btns"><button class="btn" id="copier">Copier mon bilan</button><button class="btn ghost" id="retour">Mon parcours</button></div></div>`;
  $('#retour').onclick = accueil; window.scrollTo(0,0);
  regardKenan();
  $('#copier').onclick = () => {
    const texte = 'Mon bilan · Oh la honte ! & la peur d’avoir honte\n\n' + [...app.querySelectorAll('.bilan .item')].map(i => i.querySelector('h3').textContent + '\n' + [...i.querySelectorAll('p,li')].map(x => (x.tagName === 'LI' ? '• ' : '') + x.textContent).join('\n')).join('\n\n');
    const repli = () => { const t = document.createElement('textarea'); t.value = texte; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('Bilan copié'); } catch(e) { toast('Copie impossible'); } t.remove(); };
    try { navigator.clipboard.writeText(texte).then(() => toast('Bilan copié'), repli); } catch(e) { repli(); }
  };
}

const SUPPORT = 'meetme@mireilletanofram.com';
function infosTechniques(){
  const p = E.position || {};
  return ['Formation : Oh la honte ! & la peur d’avoir honte', 'Date : ' + new Date().toLocaleString('fr-FR'), 'Jour : ' + (p.jour||1) + ', étape : ' + ((p.etape||0)+1) + '/' + ETAPES, 'Jours terminés : ' + (E.termines.join(', ') || 'aucun'), 'Appareil : ' + navigator.userAgent].join('\n');
}
function blocAssistance(){
  return `<div class="card stack" id="assistance" style="gap:10px"><div class="eyebrow">Un problème technique ?</div>
    <p style="margin:0">Décrivez ce qui se passe. Votre message part directement à l’assistance, avec les informations utiles pour régler le problème. Vos réponses restent enregistrées.</p>
    <label class="f">Votre adresse e-mail<input type="email" id="asEmail" placeholder="pour vous répondre" autocomplete="email"></label>
    <label class="f">Le problème<textarea id="asMsg" rows="3" placeholder="Par exemple : la page ne s’affiche pas, Kenan ne répond plus…"></textarea></label>
    <div class="btns"><button class="btn" id="asEnvoyer">Envoyer à l’assistance</button></div>
    <p class="note" id="asNote" style="margin:0">Vous pouvez aussi écrire à <strong style="user-select:all">${SUPPORT}</strong>.</p></div>`;
}
async function envoyerAssistance(){
  const msg = ($('#asMsg').value || '').trim(), email = ($('#asEmail').value || '').trim(), note = $('#asNote');
  if (!msg) { note.textContent = 'Décrivez le problème en quelques mots.'; return; }
  $('#asEnvoyer').disabled = true;
  if (!BACKEND) { note.textContent = 'Aperçu : dans la version en ligne, ce message partira directement à l’assistance. Rien n’a été envoyé ici.'; $('#asEnvoyer').disabled = false; return; }
  try {
    const r = await fetch(BACKEND + '/oh-la-honte/assistance', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ a: JETON, email, message: msg, infos: infosTechniques() }) });
    const d = await r.json();
    note.textContent = d.ok ? 'Message envoyé. Nous vous répondons au plus vite.' : 'L’envoi n’a pas abouti. Écrivez-nous à ' + SUPPORT + '.';
    if (d.ok) $('#asMsg').value = '';
  } catch(err) { note.textContent = 'L’envoi n’a pas abouti. Écrivez-nous à ' + SUPPORT + '.'; }
  $('#asEnvoyer').disabled = false;
}
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'asEnvoyer') return envoyerAssistance();
  if (e.target && e.target.id === 'copierInfos') {
    const t = infosTechniques();
    const repli = () => { const x = document.createElement('textarea'); x.value = t; x.style.position='fixed'; x.style.opacity='0'; document.body.appendChild(x); x.select(); try { document.execCommand('copy'); toast('Informations copiées'); } catch(err) { toast('Copie impossible'); } x.remove(); };
    try { navigator.clipboard.writeText(t).then(() => toast('Informations copiées'), repli); } catch(err) { repli(); }
  }
});
$('#versAccueil').onclick = accueil;

/* ---------- Version en ligne : serveur ---------- */
let tSync = null;
function etatServeur(){ const c = JSON.parse(JSON.stringify(E)); delete c.chats; return c; }
function synchro(immediat){
  if (!JETON) return Promise.resolve();
  clearTimeout(tSync);
  const go = () => fetch(BACKEND + '/oh-la-honte/progression', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ a: JETON, etat: etatServeur() }) })
    .then(r => r.json()).then(d => { if (d && d.ok && Array.isArray(d.jours)) fusionJours(d.jours); }).catch(() => {});
  if (immediat) return go();
  tSync = setTimeout(go, 1200); return Promise.resolve();
}
function fusionJours(js){ C.jours = js.map(j => { const ancien = (C.jours || []).find(x => x.n === j.n); return j.questions ? j : (ancien && ancien.questions ? ancien : j); }); }
async function charger(){
  const r = await fetch(BACKEND + '/oh-la-honte/parcours', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ a: JETON }) });
  const d = await r.json();
  if (!d || !d.ok) { const e = new Error((d && d.erreur) || 'acces'); e.acces = true; throw e; }
  const js = d.jours; delete d.jours; delete d.ok;
  C = Object.assign({}, C, d); fusionJours(js); MAX_ECH = C.kenan_echanges_max || 4;
  return d;
}
function sansAcces(refuse){
  $('#versAccueil').hidden = true;
  app.innerHTML = `<div class="stack"><div class="eyebrow">Parcours interactif · 7 jours</div>
    <h1>Oh la honte&nbsp;!<em>&amp; la peur d’avoir honte</em></h1>
    <div class="card"><p style="margin-top:0">${refuse ? 'Ce lien d’accès n’est pas reconnu.' : 'Votre accès personnel se trouve dans l’e-mail reçu après votre achat.'}</p>
    <p>Vous ne le retrouvez pas ? Indiquez l’adresse e-mail utilisée lors de l’achat : nous vous le renvoyons.</p>
    <form id="rf" novalidate style="display:grid;gap:10px"><input type="email" id="rEmail" autocomplete="email" placeholder="Votre adresse e-mail" aria-label="Votre adresse e-mail" style="padding:13px;border-radius:10px;border:1px solid #c9a25b;font:inherit;font-size:16px">
    <button class="btn" type="submit">Recevoir mon lien</button></form><p class="note" id="rNote"></p></div>
    <p class="note">Vous n’avez pas encore le parcours ? <a href="../../oh-la-honte.html">Découvrir la formation</a></p></div>`;
  $('#rf').addEventListener('submit', e => { e.preventDefault();
    const email = $('#rEmail').value.trim(), n = $('#rNote');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { n.textContent = 'Vérifiez l’adresse e-mail.'; return; }
    fetch(BACKEND + '/oh-la-honte/retrouver', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ email }) })
      .then(() => { n.textContent = 'Si cette adresse correspond à un achat, votre lien vient de vous être envoyé. Pensez à regarder dans les courriers indésirables.'; })
      .catch(() => { n.innerHTML = 'L’envoi n’a pas abouti. Écrivez-nous à <strong>meetme@mireilletanofram.com</strong>.'; });
  });
}
async function demarrer(){
  if (!JETON) return sansAcces(false);
  app.innerHTML = '<p class="muted">Chargement de votre parcours…</p>';
  try {
    const d = await charger();
    const srv = d.etat || {}, loc = E;
    const poids = x => ((x.termines || []).length * 1000) + Object.keys(x.reponses || {}).length + Object.keys(x.exercices || {}).length + (x.livret ? 1 : 0);
    if (poids(srv) >= poids(loc)) E = Object.assign({ reponses:{}, exercices:{}, retenir:{}, tests:{}, syntheses:{}, chats:{}, termines:[], position:{jour:1,etape:0} }, srv, { chats: loc.chats || {} });
    else synchro(true);
    nettoyerChats(); accueil();
  } catch(e) {
    if (e.acces) { try { localStorage.removeItem('olh-jeton'); } catch(x) {} return sansAcces(true); }
    app.innerHTML = '<div class="card"><p>Votre parcours n’a pas pu être chargé. Vérifiez votre connexion, puis réessayez.</p><button class="btn" id="reessayer">Réessayer</button></div>';
    $('#reessayer').onclick = demarrer;
  }
}
demarrer();
</script>
