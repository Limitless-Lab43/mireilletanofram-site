<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Je choisis d'être Libre et Joyeuse · Lecture</title>
<style>
  :root{ --creme:#FBF5EE; --rose:#B76E79; --brun:#33231B; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:#EFE6DC;color:var(--brun);font-family:Georgia,"Times New Roman",serif;
       -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  header{position:sticky;top:0;z-index:10;background:rgba(251,245,238,.96);
         border-bottom:1px solid rgba(183,110,121,.35);backdrop-filter:blur(6px)}
  .bar{max-width:600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
  .titre{flex:1;font-style:italic;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titre b{color:var(--rose);font-weight:normal}
  .compteur{font-family:Arial,sans-serif;font-size:12px;color:var(--rose);white-space:nowrap}
  .reprise{display:none;max-width:600px;margin:12px auto 0;padding:0 16px}
  .reprise button{width:100%;padding:12px;border:1px solid var(--rose);border-radius:999px;background:var(--creme);
       color:var(--brun);font-family:Georgia,serif;font-size:15px;font-style:italic;cursor:pointer}
  main{max-width:600px;margin:0 auto;padding:12px 10px 40px}
  .page{position:relative;margin:0 auto 14px;background:var(--creme);border-radius:4px;
        box-shadow:0 2px 10px rgba(51,35,27,.12);aspect-ratio:900/1687;overflow:hidden}
  .page img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
  .voile{position:absolute;inset:0}
  footer{max-width:600px;margin:0 auto;padding:10px 20px 50px;text-align:center;font-size:15px;line-height:1.6}
  footer .etoile{color:var(--rose);font-size:18px;display:block;margin-bottom:8px}
  footer a{color:var(--rose);text-decoration:none;border-bottom:1px solid rgba(183,110,121,.5)}
  .usage{font-family:Arial,sans-serif;font-size:11px;color:#8a7468;margin-top:14px}
  @media print{ body *{display:none !important} body::after{content:"Lecture en ligne uniquement.";display:block;padding:40px;font-size:18px} }
</style>
</head>
<body oncontextmenu="return false">
<header>
  <div class="bar">
    <div class="titre">Je choisis d'être <b>Libre et Joyeuse</b></div>
    <div class="compteur" id="compteur">1 / 74</div>
  </div>
</header>

<div class="reprise" id="reprise"><button type="button" id="btnReprise">Reprendre ma lecture</button></div>

<main id="livre"></main>

<footer>
  <span class="etoile">✦</span>
  Une difficulté pour lire le livre&nbsp;?<br>
  WhatsApp&nbsp;: <a href="https://wa.me/2250546066257">+225 05 46 06 62 57</a><br>
  E-mail&nbsp;: <a href="mailto:meetme@mireilletanofram.com">meetme@mireilletanofram.com</a>
  <p class="usage">Ce livre est réservé à un usage personnel. Merci de ne pas le partager.<br>© Mireille TANO-FRAM</p>
</footer>

<script>
(function(){
  var TOTAL = 74, livre = document.getElementById('livre'), compteur = document.getElementById('compteur');
  var CLE = 'lj-page-v2';
  for (var i = 1; i <= TOTAL; i++) {
    var n = ('00' + i).slice(-3);
    var d = document.createElement('div');
    d.className = 'page'; d.id = 'p' + i; d.setAttribute('data-n', i);
    var img = document.createElement('img');
    img.src = 'p/' + n + '.webp'; img.alt = 'Page ' + i; img.loading = i <= 3 ? 'eager' : 'lazy';
    img.decoding = 'async'; img.draggable = false;
    var v = document.createElement('div'); v.className = 'voile';
    d.appendChild(img); d.appendChild(v); livre.appendChild(d);
  }
  var courante = 1;
  var obs = new IntersectionObserver(function(entrees){
    entrees.forEach(function(e){
      if (e.isIntersecting) {
        courante = +e.target.getAttribute('data-n');
        compteur.textContent = courante + ' / ' + TOTAL;
        try { localStorage.setItem(CLE, courante); } catch (err) {}
      }
    });
  }, { rootMargin: '-45% 0px -45% 0px' });
  document.querySelectorAll('.page').forEach(function(p){ obs.observe(p); });
  var memo = 0;
  try { memo = +localStorage.getItem(CLE) || 0; } catch (err) {}
  if (memo > 2) {
    var r = document.getElementById('reprise'); r.style.display = 'block';
    document.getElementById('btnReprise').textContent = 'Reprendre ma lecture à la page ' + memo;
    document.getElementById('btnReprise').addEventListener('click', function(){
      document.getElementById('p' + memo).scrollIntoView(); r.style.display = 'none';
    });
  }
  document.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && /^[spu]$/i.test(e.key)) e.preventDefault();
  });
})();
</script>
</body>
</html>
